#####################
#     loan-calc     #
#####################
services:
  loan-calc:
    build: .
    container_name: loan-calc
    restart: unless-stopped
    networks:
      - net_loan-calc
    environment:
      - "TZ=Europe/Paris"
      - "DATABASE_PATH=/usr/src/app/data/loan-calc.db"
      - "API_PORT=3000"
      - "OIDC_ISSUER=https://auth.homelab.fr/application/o/loan-calc/"
      - "OIDC_CLIENT_ID="
      - "OIDC_CLIENT_SECRET="
      - "OIDC_REDIRECT_URI=https://loan-calc.homelab.fr/auth/callback"
      - "SESSION_SECRET="
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_loan-calc"
      - "traefik.http.routers.loan-calc.rule=Host(`loan-calc.domaine.fr`)"
      - "traefik.http.routers.loan-calc.entrypoints=websecure"
      - "traefik.http.routers.loan-calc.tls=true"
      - "traefik.http.routers.loan-calc.tls.options=tls13only@file"
      - "traefik.http.routers.loan-calc.tls.certresolver=ovhresolver"
      - "traefik.http.routers.loan-calc.middlewares=chain-secure@file"
      - "traefik.http.services.loan-calc.loadbalancer.server.port=3000"
    volumes:
      - ./loan-calc/data:/usr/src/app/data

networks:
  net_loan-calc:
    driver: bridge
